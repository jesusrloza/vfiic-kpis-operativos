# Schema VFIIC v6
# Cada clave de formulario debe coincidir con el .xlsx en inputs/ (mismo texto + .xlsx).
# Use `descripcion` solo si la etiqueta del reporte debe diferir de la columna Excel.
# Opcional por KPI: aggregation (sum|count|avg), value_parser (numeric|sum_cantidad).

