# Tema del workbook comparativo apilado.
# Encabezado azul oscuro con texto blanco en negritas para todos los bloques.

[header]
fill = "1F4E79"
font_color = "FFFFFF"
bold = true

[title]
fill = "1F4E79"
font_color = "FFFFFF"
bold = true

[semantic_colors]
positive = "1F4E79"
negative = "C00000"
neutral = "000000"

[row_stripes]
enabled = true
even = "FFFFFF"
odd = "D9E2F3"

[table]
style = "TableStyleMedium2"
show_row_stripes = true
show_column_stripes = false

[layout]
freeze_panes = "A3"
show_grid_lines = true

[column_width]
min = 14
max = 56
margin = 2

[[column_formats]]
match = "exact"
pattern = "indicador"
number_format = "General"
align = "left"

[[column_formats]]
match = "prefix"
pattern = "valor_"
number_format = "0"
align = "right"

[[column_formats]]
match = "exact"
pattern = "diferencia_mom"
number_format = "0"
align = "right"

[[column_formats]]
match = "exact"
pattern = "diferencia_yoy"
number_format = "0"
align = "right"

[[column_formats]]
match = "exact"
pattern = "porcentaje_mom"
number_format = "0.00\"%\""
align = "right"

[[column_formats]]
match = "exact"
pattern = "porcentaje_yoy"
number_format = "0.00\"%\""
align = "right"

[header_labels]
indicador = "Indicador"
diferencia_mom = "Diferencia (mes anterior)"
porcentaje_mom = "Variación % (mes anterior)"
diferencia_yoy = "Diferencia (año anterior)"
porcentaje_yoy = "Variación % (año anterior)"
valor_actual = "Mes actual"
valor_mes_anterior = "Mes anterior"
valor_anio_anterior = "Mismo mes año anterior"
