[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vfiic-kpis"
version = "0.1.0"
description = "Procesamiento de KPIs periciales VFIIC desde insumos Jotform/Google Sheets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "openpyxl>=3.1.0",
  "PyYAML>=6.0",
]

[project.scripts]
vfiic-partitioned = "vfiic_kpis.cli:main_partitioned"
vfiic-comparativo = "vfiic_kpis.cli:main_comparativo"
vfiic-run-all = "vfiic_kpis.cli:main_run_all"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

