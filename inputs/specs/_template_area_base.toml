[area]
id = "mi_area"
display_name = "Mi Area"
source_glob = "Mi archivo de entrada.xlsx"
sheet_name = "Form responses"
date_column = "Periodo Evaluado"

# Si el agente/titular viene en varias columnas:
agent_columns = [
  "Perito - Nombre(s)",
  "Perito - Apellido Paterno",
  "Perito - Apellido Materno",
]
agent_output_column = "Agente/Titular"

[[kpis]]
name = "kpi_1"
source_column = "Columna KPI 1"
aggregation = "sum"
value_parser = "numeric"

[[kpis]]
name = "kpi_2"
source_column = "Columna KPI 2"
aggregation = "sum"
value_parser = "numeric"

